<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Lễ Hằng Thuận - Chùa Bửu Đà</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; color: #44403c; background-color: #fffbeb; }
        .font-title { font-family: 'Be Vietnam Pro', sans-serif !important; font-weight: 900 !important; letter-spacing: 0.5px; line-height: 1.4; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #b45309; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen flex flex-col font-sans">
        <!-- Giao diện hiển thị động bằng JavaScript ở đây -->
    </div>

    <script>
        // --- CẤU HÌNH HỆ THỐNG ---
        const CONFIG_TEMPLE_NAME = "Chùa Bửu Đà";
        const CONFIG_TEMPLE_ADDRESS = "419/11 Cách Mạng Tháng 8, P.Hoà Hưng, Q.10, Tp.HCM";
        const ADMIN_PASSWORD = "Q"; 
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxJAdvJoKt034L3KVkMZVJs1o5WrqE8avyxk_JwqkspFoASLc5U2AU2Cn0MiZLvIIb/exec"; 
        const TEMPLE_ZALO = "0703.676.073";
        const ZALO_LINK = "https://zalo.me/0703676073";

        // --- TRẠNG THÁI ỨNG DỤNG (STATE) ---
        let state = {
            view: 'public_form', 
            isAdmin: false,
            ceremonies: [],
            bookedDates: [],
            selectedCeremony: null,
            guestSubmittedData: null,
            isSyncing: false,
            isSaving: false,
            showBookedDates: false,
            dateError: ""
        };

        // --- ICONS SVG ---
        const Icons = {
            Plus: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>',
            Phone: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.05 12.05 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.03 12.03 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
            ArrowLeft: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>',
            Trash2: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>',
            Pencil: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>',
            Users: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
            Calendar: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>',
            Download: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>',
            Refresh: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>',
            CheckCircle: '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="green" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
            Lock: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
            Eye: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>'
        };

        // --- HÀM XUẤT FILE WORD ---
        function exportToWordGlobal(ceremony) {
            try {
                if (!ceremony) {
                    alert("Chưa có dữ liệu để xuất file!");
                    return;
                }
                const safe = (txt) => txt ? txt : '...';
                const dateStr = (d) => {
                    if (!d) return '...';
                    const dateObj = new Date(d);
                    return !isNaN(dateObj) ? dateObj.toLocaleDateString('vi-VN') : d;
                };
                const timeStr = (t) => {
                    if (!t) return '...';
                    if (t.includes('T')) {
                        const dateObj = new Date(t);
                        return !isNaN(dateObj) ? dateObj.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}) : t;
                    }
                    return t;
                };

                const content = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset="utf-8">
                    <title>PhieuDangKy</title>
                    <style>
                        body { font-family: 'Times New Roman', serif; font-size: 13pt; line-height: 1.4; }
                        table { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 10px; }
                        td, th { border: 1px solid #000; padding: 6px; vertical-align: top; }
                        .header-row td { background-color: #f0f0f0; text-align: center; font-weight: bold; }
                        .title { text-align: center; font-weight: bold; text-transform: uppercase; margin: 0; color: #B45309; }
                        .section { font-weight: bold; border-bottom: 1px solid #000; margin-top: 20px; padding-bottom: 3px; text-transform: uppercase; }
                    </style>
                </head>
                <body>
                    <p style="text-align: center; font-weight: bold; color: #666; font-size: 11pt; margin:0;">GIÁO HỘI PHẬT GIÁO VIỆT NAM - TP.HCM</p>
                    <h1 class="title" style="font-size: 18pt; margin-top: 5px;">${CONFIG_TEMPLE_NAME.toUpperCase()}</h1>
                    <p style="text-align: center; font-style: italic; margin-bottom: 20px;">${CONFIG_TEMPLE_ADDRESS}</p>
                    <hr style="width: 50%;" />
                    
                    <h2 style="text-align: center; text-transform: uppercase; font-size: 16pt; margin-top: 20px;">PHIẾU ĐĂNG KÝ LỄ HẰNG THUẬN</h2>
                    <p style="text-align: center;">Mã hồ sơ: <b>#${ceremony.id ? String(ceremony.id).slice(-6) : '---'}</b></p>
                    
                    <div style="border: 2px solid #333; padding: 10px; margin: 15px 0; text-align: center; background-color: #f9f9f9;">
                        <b>NGƯỜI LIÊN HỆ:</b> ${safe(ceremony.contactPhone)}
                    </div>
                    
                    <div class="section">I. THỜI GIAN & ĐỊA ĐIỂM</div>
                    <table>
                        <tr>
                            <td width="150"><b>Ngày Dương:</b></td><td>${dateStr(ceremony.date)}</td>
                            <td width="120"><b>Ngày Âm:</b></td><td>${safe(ceremony.lunarDate)}</td>
                        </tr>
                        <tr>
                            <td><b>Giờ làm lễ:</b></td><td>${timeStr(ceremony.time)}</td>
                            <td><b>Số khách:</b></td><td>${safe(ceremony.guestCount)} người</td>
                        </tr>
                    </table>

                    <div class="section">II. THÔNG TIN HAI HỌ</div>
                    <table>
                        <tr class="header-row">
                            <td colspan="2">NHÀ TRAI</td>
                            <td colspan="2">NHÀ GÁI</td>
                        </tr>
                        <tr>
                            <td width="100"><b>Tên:</b></td><td><b>${safe(ceremony.groom?.fullName)}</b></td>
                            <td width="100"><b>Tên:</b></td><td><b>${safe(ceremony.bride?.fullName)}</b></td>
                        </tr>
                        <tr>
                            <td><b>Ngày sinh:</b></td><td>${safe(ceremony.groom?.birthDate)}</td>
                            <td><b>Ngày sinh:</b></td><td>${safe(ceremony.bride?.birthDate)}</td>
                        </tr>
                        <tr>
                            <td><b>Pháp danh:</b></td><td>${safe(ceremony.groom?.dharmaName)}</td>
                            <td><b>Pháp danh:</b></td><td>${safe(ceremony.bride?.dharmaName)}</td>
                        </tr>
                        <tr>
                            <td><b>SĐT:</b></td><td>${safe(ceremony.groom?.phone)}</td>
                            <td><b>SĐT:</b></td><td>${safe(ceremony.bride?.phone)}</td>
                        </tr>
                        <tr>
                            <td><b>Cha:</b></td><td>${safe(ceremony.groom?.fatherName)}</td>
                            <td><b>Cha:</b></td><td>${safe(ceremony.bride?.fatherName)}</td>
                        </tr>
                        <tr>
                            <td><b>Mẹ:</b></td><td>${safe(ceremony.groom?.motherName)}</td>
                            <td><b>Mẹ:</b></td><td>${safe(ceremony.bride?.motherName)}</td>
                        </tr>
                        <tr>
                            <td><b>Địa chỉ:</b></td><td>${safe(ceremony.groom?.address)}</td>
                            <td><b>Địa chỉ:</b></td><td>${safe(ceremony.bride?.address)}</td>
                        </tr>
                    </table>

                    <div class="section">III. DỊCH VỤ & YÊU CẦU</div>
                    <ul>
                        <li><b>Tiệc chay:</b> ${ceremony.hasBanquet ? `Có (${safe(ceremony.banquetTables)} bàn)` : 'Không'}</li>
                        <li><b>Media:</b> ${ceremony.mediaOption === 'temple' ? 'Nhờ Chùa hỗ trợ' : 'Gia đình tự túc'}</li>
                        <li><b>Hoa:</b> ${safe(ceremony.flowerPreferences)}</li>
                        <li><b>Ghi chú:</b> ${safe(ceremony.offeringsInfo)}</li>
                    </ul>
                </body>
                </html>`;

                const blob = new Blob(['﻿', content], { type: 'application/msword' });
                const fileName = `PhieuDangKy_${safe(ceremony.groom?.fullName).replace(/\s+/g, '')}.doc`;
                
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (err) {
                console.error(err);
                alert("Lỗi tải file: " + err.message);
            }
        }

        // --- CÁC HÀM XỬ LÝ DỮ LIỆU & ĐỒNG BỘ ---
        async function loadData() {
            if (!GOOGLE_SCRIPT_URL) return;
            state.isSyncing = true;
            render();
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                const cloudData = await res.json();
                if (Array.isArray(cloudData)) {
                    state.ceremonies = cloudData;
                    state.bookedDates = cloudData.map(c => c.date).filter(d => d);
                }
            } catch (err) { 
                console.error("Lỗi tải data", err); 
            } finally { 
                state.isSyncing = false; 
                render();
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            const formData = {
                id: document.getElementById('form-id').value || Date.now().toString(),
                contactPhone: document.getElementById('form-contactPhone').value,
                groom: {
                    fullName: document.getElementById('groom-fullName').value,
                    dharmaName: document.getElementById('groom-dharmaName').value,
                    birthDate: document.getElementById('groom-birthDate').value,
                    phone: document.getElementById('groom-phone').value,
                    fatherName: document.getElementById('groom-fatherName').value,
                    motherName: document.getElementById('groom-motherName').value,
                    address: document.getElementById('groom-address').value
                },
                bride: {
                    fullName: document.getElementById('bride-fullName').value,
                    dharmaName: document.getElementById('bride-dharmaName').value,
                    birthDate: document.getElementById('bride-birthDate').value,
                    phone: document.getElementById('bride-phone').value,
                    fatherName: document.getElementById('bride-fatherName').value,
                    motherName: document.getElementById('bride-motherName').value,
                    address: document.getElementById('bride-address').value
                },
                date: document.getElementById('form-date').value,
                time: document.getElementById('form-time').value,
                lunarDate: document.getElementById('form-lunarDate').value,
                guestCount: document.getElementById('form-guestCount').value || '0',
                hasBanquet: document.getElementById('form-hasBanquet').checked,
                banquetTables: document.getElementById('form-banquetTables') ? document.getElementById('form-banquetTables').value : '',
                mediaOption: document.querySelector('input[name="mediaOption"]:checked')?.value || 'own',
                flowerPreferences: document.getElementById('form-flowerPreferences').value,
                offeringsInfo: document.getElementById('form-offeringsInfo').value,
                notes: ''
            };

            // Kiểm tra trùng lịch đối với Phật tử công cộng
            if (!state.isAdmin && state.bookedDates.includes(formData.date)) {
                alert("Ngày bạn chọn đã bị trùng lịch. Vui lòng kiểm tra và chọn ngày khác!");
                return;
            }

            state.isSaving = true;
            render();

            try {
                const actionType = (state.view === 'edit') ? 'UPDATE' : 'CREATE';
                const payload = { ...formData, action: actionType };
                
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (state.isAdmin) {
                    alert("Đã lưu thông tin thành công!");
                    await loadData();
                    if (actionType === 'UPDATE') {
                        state.selectedCeremony = formData;
                        state.view = 'detail';
                    } else {
                        state.view = 'list';
                    }
                } else {
                    state.guestSubmittedData = formData;
                    state.view = 'guest_success';
                }
            } catch (err) {
                alert("Có lỗi kết nối hệ thống. Vui lòng thử lại hoặc liên hệ Nhà Chùa.");
            } finally {
                state.isSaving = false;
                render();
            }
        }

        function handleDelete(id) {
            if (confirm("Xóa khỏi danh sách hiển thị cục bộ?\n(Dữ liệu trên Google Sheet cần xóa thủ công nếu muốn mất hẳn)")) {
                state.ceremonies = state.ceremonies.filter(c => c.id !== id);
                state.selectedCeremony = null; 
                state.view = 'list';
                render();
            }
        }

        function checkDateAvailability(selectedDate) {
            if (state.bookedDates && state.bookedDates.includes(selectedDate)) {
                if (!state.isAdmin) {
                    state.dateError = "⚠️ Ngày này Nhà Chùa đã có lịch. Vui lòng chọn ngày khác.";
                    return false;
                } 
            }
            state.dateError = "";
            return true;
        }

        function handleLogin() {
            const pwd = prompt("Nhập mật khẩu quản trị viên:");
            if (pwd === ADMIN_PASSWORD) {
                state.isAdmin = true;
                state.view = 'list';
                loadData(); 
            } else if (pwd) {
                alert("Mật khẩu không đúng!");
            }
        }

        function handleLogout() {
            state.isAdmin = false;
            state.view = 'public_form';
            render();
        }

        // --- GIAO DIỆN CHUYỂN ĐỔI CHỮA CHÁY (RE-RENDER ENGINE) ---
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = ''; // Clear cũ

            // 1. THANH ĐIỀU HƯỚNG (NAVBAR)
            const nav = document.createElement('nav');
            nav.className = "bg-amber-800 text-amber-50 shadow-md sticky top-0 z-50";
            nav.innerHTML = `
                <div class="container mx-auto px-4 h-16 flex items-center justify-between">
                    <div id="nav-logo" class="flex items-center gap-3 cursor-pointer">
                        <div class="w-10 h-10 bg-amber-900 rounded-full flex items-center justify-center border-2 border-amber-600 font-title font-bold text-xl">B</div>
                        <h1 class="font-bold text-lg hidden sm:block font-title">${CONFIG_TEMPLE_NAME}</h1>
                    </div>
                    ${state.isAdmin ? `
                        <div class="flex items-center gap-3">
                            <span class="text-xs bg-amber-900/50 px-2 py-1 rounded">Admin Mode</span>
                            <button id="btn-logout" class="text-sm bg-stone-700 hover:bg-stone-600 px-3 py-1.5 rounded transition">Đăng xuất</button>
                        </div>
                    ` : ''}
                </div>
            `;
            app.appendChild(nav);

            document.getElementById('nav-logo').addEventListener('click', () => {
                state.view = state.isAdmin ? 'list' : 'public_form';
                render();
            });
            if (state.isAdmin) {
                document.getElementById('btn-logout').addEventListener('click', handleLogout);
            }

            // 2. PHẦN NỘI DUNG CHÍNH (MAIN CONTAINER)
            const main = document.createElement('main');
            main.className = "flex-grow container mx-auto px-4 py-8";
            
            // ===== ĐIỂM SỬA LỖI CỐT LÕI NẰM Ở ĐÂY =====
            // Phải đẩy thẻ main lên giao diện TRƯỚC, thì các lệnh document.getElementById bên dưới mới tìm thấy được Form
            app.appendChild(main); 
            
            // XỬ LÝ HIỂN THỊ THEO VIEW
            if (state.view === 'public_form' || state.view === 'form' || state.view === 'edit') {
                const isEdit = state.view === 'edit';
                const data = isEdit ? state.selectedCeremony : null;

                main.innerHTML = `
                    <div class="max-w-4xl mx-auto">
                        ${!state.isAdmin ? `
                            <div class="text-center mb-8 fade-in">
                                <h2 class="text-3xl font-title font-bold text-amber-900 mb-3 uppercase">Đăng Ký Lễ Hằng Thuận</h2>
                                <p class="text-stone-600">Kính mời quý Phật tử điền thông tin để đăng ký tổ chức lễ tại ${CONFIG_TEMPLE_NAME}.</p>
                            </div>
                        ` : ''}
                        
                        <div class="bg-white rounded-xl shadow-xl p-6 md:p-8 max-w-4xl mx-auto fade-in border border-amber-100 relative mb-12">
                            ${state.isSaving ? `
                                <div class="absolute inset-0 bg-white/90 z-20 flex flex-col items-center justify-center rounded-xl">
                                    <div class="loader mb-4"></div>
                                    <p class="text-amber-800 font-bold text-lg">${state.isAdmin ? "Đang lưu thay đổi..." : "Đang gửi hồ sơ..."}</p>
                                </div>
                            ` : ''}
                            
                            <div class="flex justify-between items-center mb-6 border-b border-stone-100 pb-4">
                                <h2 class="text-2xl font-title font-bold text-amber-800 uppercase">
                                    ${isEdit ? 'Cập Nhật Hồ Sơ' : 'Đăng Ký Lễ Hằng Thuận'}
                                </h2>
                                ${!state.isAdmin ? '<div class="hidden sm:block bg-amber-100 text-amber-800 px-3 py-1 rounded-full text-xs font-bold uppercase">Phật Tử Đăng Ký</div>' : ''}
                            </div>

                            <form id="ceremony-form" class="space-y-6">
                                <input type="hidden" id="form-id" value="${data?.id || ''}">
                                
                                <!-- NHÀ TRAI -->
                                <div class="bg-stone-50 p-5 rounded-lg border border-stone-200">
                                    <h3 class="font-bold text-amber-700 flex items-center gap-2 mb-4 text-lg">${Icons.Users} Nhà Trai</h3>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                `;

                document.getElementById('btn-back-list').addEventListener('click', () => {
                    state.view = 'list';
                    render();
                });
                document.getElementById('btn-delete-detail').addEventListener('click', () => handleDelete(ceremony.id));
                document.getElementById('btn-edit-detail').addEventListener('click', () => {
                    state.view = 'edit';
                    render();
                });
                document.getElementById('btn-export-word').addEventListener('click', () => exportToWordGlobal(ceremony));
            }
            
            // 3. CHÂN TRANG (FOOTER)
            const footer = document.createElement('footer');
            footer.className = "bg-stone-900 text-stone-400 py-8 text-center text-sm mt-auto border-t border-stone-800";
            footer.innerHTML = `
                <div class="container mx-auto px-4">
                    <p class="font-title text-lg text-stone-300 mb-2">${CONFIG_TEMPLE_NAME}</p>
                    <p class="mb-4">${CONFIG_TEMPLE_ADDRESS}</p>
                    ${!state.isAdmin ? `
                        <button id="btn-login-admin" class="inline-flex items-center gap-2 text-stone-600 hover:text-stone-300 transition px-4 py-2 rounded hover:bg-stone-800">
                            ${Icons.Lock} <span>Quản trị viên</span>
                        </button>
                    ` : ''}
                </div>
            `;
            app.appendChild(footer);

            if (!state.isAdmin) {
                document.getElementById('btn-login-admin').addEventListener('click', handleLogin);
            }
        }

        // --- KHỞI CHẠY ỨNG DỤNG LẦN ĐẦU ---
        window.addEventListener('DOMContentLoaded', () => {
            render();
            loadData(); // Tự động load đồng bộ lịch bận ban đầu
        });
    </script>
</body>
</html>
